  dlg.innerHTML=`<div class="dlg"><div class="dlg-h"><div><h2>How statuses work</h2><p>Each vehicle takes the worst status of its two documents.</p></div><button class="x" data-close aria-label="Close">${I.x}</button></div><div class="dlg-b" style="gap:12px">
    <p style="margin:0"><span class="chip s-expired">Expired</span> A roadworthy certificate or insurance date has passed. The vehicle must not be dispatched until renewed.</p>
    <p style="margin:0"><span class="chip s-missing">Missing</span> A document date hasn't been entered. Treat as not road-legal until the document is checked and recorded.</p>
    <p style="margin:0"><span class="chip s-due">Due soon</span> A document expires today or within the next ${WINDOW} days. Book the DVLA test or insurance renewal now.</p>
    <p style="margin:0"><span class="chip s-valid">Valid</span> Both documents run for more than ${WINDOW} more days.</p>
    <p style="margin:0" class="muted">Dates use Ghana time (GMT). Every save records who made it and what changed, in the vehicle's history and the activity log. If two people edit the same vehicle at once, the second save is stopped so nothing is overwritten. Archive vehicles that leave the fleet; their history is kept.</p>
  </div></div>`;
  dlg.showModal();
}

/* ───────── events ───────── */
document.addEventListener("click",e=>{
  const t=e.target.closest("button,[data-open],a"); if(!t) return;
  if(t.hasAttribute("data-close")){ t.closest("dialog").close(); return; }
  if(t.dataset.go){ const f={}; if(t.dataset.group) f.group=t.dataset.group; if(t.dataset.status) f.status=t.dataset.status; closeAll(); go(t.dataset.go,f); return; }
  if(t.dataset.open){ openDetail(t.dataset.open); return; }
  if(t.dataset.edit){ openEdit(t.dataset.edit); return; }
  if(t.dataset.renew){ openRenew(t.dataset.renew,t.dataset.kind); return; }
  if(t.dataset.archive){ toggleArchive(t.dataset.archive); return; }
  if(t.dataset.sort){ const k=t.dataset.sort; state.sort = state.sort.key===k?{key:k,dir:-state.sort.dir}:{key:k,dir:1}; $("#reg-results").innerHTML=registerResults(); return; }
  if(t.dataset.arch!==undefined){ state.f.archived=t.dataset.arch==="1"; render(); return; }
  const a=t.dataset.act;
  if(a==="add") openEdit(null);
  else if(a==="import") openImport();
  else if(a==="export") exportCSV(false);
  else if(a==="template") exportCSV(true);
  else if(a==="help") openHelp();
  else if(a==="demo-on"){ state.demo=true; render(); }
  else if(a==="demo-off"){ state.demo=false; closeAll(); render(); }
  else if(a==="refresh"){ refresh(false).then(()=>{ if(state.dbState==="live") toast("Register up to date"); }); }
  else if(a==="signout"){ signOut(false); }
  else if(a==="clear"){ go("register"); }
});
document.addEventListener("keydown",e=>{ if(e.key==="Enter"){ const tr=e.target.closest&&e.target.closest("tr[data-open]"); if(tr) openDetail(tr.dataset.open); } });
document.addEventListener("input",e=>{ if(e.target.id==="q"){ state.f.q=e.target.value; $("#reg-results").innerHTML=registerResults(); } });
document.addEventListener("change",e=>{
  const m={"f-group":"group","f-site":"site","f-status":"status"}[e.target.id];
  if(m){ state.f[m]=e.target.value; if(m==="group") renderNav(); $("#reg-results").innerHTML=registerResults(); }
});
function closeAll(){ document.querySelectorAll("dialog[open]").forEach(d=>d.close()); }
setInterval(()=>{ const t=todayISO(); if(t!==state.today){ state.today=t; render(); } },60000);

/* ───────── boot ───────── */
state.session = API_READY ? store.get() : null;
if(state.session){ state.dbState="connecting"; render(); refresh(false); }
else { state.dbState="signin"; render(); }
setInterval(()=>{ if(document.visibilityState==="visible" && state.session && !state.demo && !document.querySelector("dialog[open]")) refresh(true); }, REFRESH_MS);
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible" && state.session && state.syncedAt && Date.now()-state.syncedAt>REFRESH_MS) refresh(true); });
})();
</script>
</body>
</html>
