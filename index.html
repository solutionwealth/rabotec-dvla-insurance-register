<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#164C9D">
<meta name="description" content="Rabotec asset register with DVLA roadworthy certificates, insurance, 2-week red-flag alerts and PowerPoint reports.">
<title>Rabotec DVLA &amp; Insurance Register</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23164C9D'/%3E%3Crect y='26' width='32' height='6' fill='%23F7941D'/%3E%3Ctext x='16' y='20' font-family='Arial' font-weight='700' font-size='14' text-anchor='middle' fill='%23fff'%3ERB%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed left rail (desktop) / top tab strip (phone) + working canvas; summary before detail on every view.
   Colour: Rabotec Group brand — royal blue #164C9D, amber #F7941D, navy #19232B (from rabotecgroup.com). */
:root{
  --bg:#f2f3f5;           /* Rabotec site light grey */
  --surface:#ffffff;
  --surface-2:#e9edf3;
  --line:#d6dce5;
  --ink:#19232B;          /* Rabotec navy */
  --ink-2:#4a5663;
  --ink-3:#768392;
  --accent:#164C9D;       /* Rabotec royal blue */
  --accent-ink:#ffffff;
  --accent-soft:#e2eaf6;
  --rail:#164C9D;
  --rail-ink:#ffffff;
  --rail-dim:#b9cbea;
  --hi:#F7941D;           /* Rabotec amber: active marks, focus, insurance series */
  --ok:#1f7a45;  --ok-soft:#e1f1e6;
  --due:#a14f00; --due-soft:#fcebd6;
  --bad:#b3261e; --bad-soft:#f9e1de;
  --miss:#5a4f9a;--miss-soft:#e9e6f6;
  --shadow:0 1px 2px rgba(25,35,43,.06),0 6px 20px rgba(25,35,43,.07);
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e141a;--surface:#16202a;--surface-2:#1d2935;--line:#2a3846;
  --ink:#e7ecf2;--ink-2:#a9b6c4;--ink-3:#7c8a99;
  --accent:#6f9ee8;--accent-ink:#071833;--accent-soft:#182a48;
  --rail:#0f2a57;--rail-ink:#ffffff;--rail-dim:#9fb4d8;--hi:#F7941D;
  --ok:#5cc98a;--ok-soft:#173226;--due:#f0a93a;--due-soft:#3a2c14;
  --bad:#ff7b70;--bad-soft:#3d1c1a;--miss:#a99cf0;--miss-soft:#28243f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e141a;--surface:#16202a;--surface-2:#1d2935;--line:#2a3846;
  --ink:#e7ecf2;--ink-2:#a9b6c4;--ink-3:#7c8a99;
  --accent:#6f9ee8;--accent-ink:#071833;--accent-soft:#182a48;
  --rail:#0f2a57;--rail-ink:#ffffff;--rail-dim:#9fb4d8;--hi:#F7941D;
  --ok:#5cc98a;--ok-soft:#173226;--due:#f0a93a;--due-soft:#3a2c14;
  --bad:#ff7b70;--bad-soft:#3d1c1a;--miss:#a99cf0;--miss-soft:#28243f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark}

*{box-sizing:border-box}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--hi);outline-offset:2px;border-radius:4px}
.num,td.n{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}

/* shell */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.rail{background:var(--rail);color:var(--rail-ink);padding:20px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.rail .brand{flex-direction:column;align-items:flex-start;gap:8px}
.rail .brand small{font-size:11.5px;letter-spacing:.12em}
.brand-logo{display:inline-flex;align-items:center;background:#fff;border-radius:7px;padding:4px 6px;flex:none}
.brand-logo img{display:block;height:26px;width:auto}
.brand-logo.fallback img{display:none}
.brand-logo.fallback::before{content:"RABOTEC";font:700 16px/26px var(--f-display);color:#164C9D;letter-spacing:.06em;padding:0 4px}
.brand-mark{width:36px;height:36px;border-radius:8px;background:var(--hi);color:#1b1b12;display:grid;place-items:center;font:700 17px/1 var(--f-display);letter-spacing:.02em}
.brand b{display:block;font:700 19px/1 var(--f-display);letter-spacing:.04em;text-transform:uppercase}
.brand small{display:block;color:var(--rail-dim);font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-top:3px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-label{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--rail-dim);padding:0 10px 6px}
.nav button{all:unset;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--rail-ink);cursor:pointer;font-weight:500}
.nav button:hover{background:rgba(255,255,255,.08)}
.nav button[aria-current="page"]{background:rgba(255,255,255,.14);box-shadow:inset 3px 0 0 var(--hi)}
.nav button:focus-visible{outline:3px solid var(--hi)}
.nav svg{width:18px;height:18px;flex:none;opacity:.9}
.nav .count{margin-left:auto;font:600 12px/1 var(--f-mono);background:var(--bad);color:#fff;border-radius:99px;padding:3px 7px}
.nav .code{font:600 12px/1 var(--f-mono);width:30px;color:var(--rail-dim)}
.nav .qty{margin-left:auto;font:500 12px/1 var(--f-mono);color:var(--rail-dim)}
.rail-foot{margin-top:auto;font-size:12px;color:var(--rail-dim);padding:0 8px;display:flex;flex-direction:column;gap:8px}
.who{display:flex;align-items:center;gap:8px;color:var(--rail-ink)}
.who img{width:26px;height:26px;border-radius:50%}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:none}
.canvas{padding-block:26px 40px;padding-inline:clamp(16px,3vw,36px);display:flex;flex-direction:column;gap:22px;max-width:1320px;width:100%}

.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px}
.eyebrow{font:600 11px/1 var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.head h1{font:700 clamp(30px,4vw,40px)/1 var(--f-display);letter-spacing:.01em;margin-top:8px;text-transform:uppercase}
.head p{margin:6px 0 0;color:var(--ink-2);max-width:62ch}
.actions{display:flex;flex-wrap:wrap;gap:8px}

.btn{display:inline-flex;align-items:center;gap:7px;border-radius:8px;border:1px solid var(--line);background:var(--surface);padding:8px 13px;font-weight:500;line-height:1.2;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px}

.banner{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;border-radius:var(--r);padding:10px 14px;border:1px solid var(--line);background:var(--surface);font-size:13.5px}
.banner.demo{background:var(--miss-soft);border-color:transparent}
.banner.warn{background:var(--due-soft);border-color:transparent}
.banner.err{background:var(--bad-soft);border-color:transparent}
.banner .grow{flex:1 1 240px;min-width:0}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block;margin-right:6px;box-shadow:0 0 0 3px var(--ok-soft)}

/* status chips */
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 10px 3px 8px;font-size:12.5px;font-weight:600;white-space:nowrap;line-height:1.3}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-valid{color:var(--ok);background:var(--ok-soft)}
.s-due{color:var(--due);background:var(--due-soft)}
.s-expired{color:var(--bad);background:var(--bad-soft)}
.s-missing{color:var(--miss);background:var(--miss-soft)}
.chip.op{color:var(--ink-2);background:var(--surface-2)}
.chip.op.grounded{color:var(--bad);background:transparent;border:1px solid currentColor}
.chip.op.maint{color:var(--due);background:transparent;border:1px solid currentColor}
.chip.op::before{display:none}

/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{all:unset;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 14px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.kpi:hover{border-color:var(--ink-3)}
.kpi:focus-visible{outline:3px solid var(--hi)}
.kpi .lbl{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.kpi .val{font:700 44px/1 var(--f-display);font-variant-numeric:tabular-nums}
.kpi .sub{font-size:12.5px;color:var(--ink-3)}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--k,var(--line))}
.kpi.ok{--k:var(--ok)}.kpi.due{--k:var(--due)}.kpi.bad{--k:var(--bad)}

.grid2{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0;display:flex;flex-direction:column;gap:14px}
.panel-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.panel-h h2{font:600 19px/1.1 var(--f-display);letter-spacing:.03em;text-transform:uppercase}
.panel-h p{margin:3px 0 0;color:var(--ink-3);font-size:12.5px}
.link{all:unset;cursor:pointer;color:var(--accent);font-weight:600;font-size:13px}
.link:hover{text-decoration:underline}
.link:focus-visible{outline:3px solid var(--hi)}

/* chart */
.chart .cw{overflow-x:auto}.chart svg{width:100%;min-width:520px;height:auto;display:block}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}

/* dispatch list */
.stoplist{display:flex;flex-direction:column}
.stop{all:unset;cursor:pointer;display:grid;grid-template-columns:86px minmax(0,1fr);gap:12px;align-items:center;padding:10px 4px;border-top:1px solid var(--line)}
.stop:first-child{border-top:0}
.stop:hover{background:var(--surface-2)}
.stop:focus-visible{outline:3px solid var(--hi)}
.plate{font:700 18px/1 var(--f-display);letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.fleetno{font:500 12px/1 var(--f-mono);color:var(--ink-3)}
.stop .why{font-size:12.5px;color:var(--ink-2)}
.empty-mini{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:16px;border-radius:8px;background:var(--ok-soft);color:var(--ok)}
.empty-mini b{font-weight:600}
.empty-mini span{color:var(--ink-2);font-size:13px}

/* groups */
.groups{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.group{all:unset;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.group:hover{border-color:var(--ink-3)}
.group:focus-visible{outline:3px solid var(--hi)}
.group .top{display:flex;justify-content:space-between;align-items:baseline}
.group .code{font:600 12px/1 var(--f-mono);color:var(--accent);background:var(--accent-soft);padding:4px 6px;border-radius:5px}
.group .n{font:700 34px/1 var(--f-display);font-variant-numeric:tabular-nums}
.group h3{font-size:13.5px;font-weight:600}
.stack{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--surface-2)}
.stack span{display:block;height:100%}
.group small{color:var(--ink-3);font-size:12px}

.sites{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.site{background:var(--surface-2);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:4px}
.site b{font:600 16px/1.1 var(--f-display);letter-spacing:.04em;text-transform:uppercase}
.site span{font-size:12.5px;color:var(--ink-2)}

/* register */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.search{flex:1 1 240px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:0 10px;min-width:0}
.search input{border:0;background:transparent;padding:9px 0;flex:1;min-width:0;outline:none}
.search svg{width:16px;height:16px;color:var(--ink-3);flex:none}
select.f{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;max-width:100%}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:8px 12px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.summary-line{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.summary-line b{color:var(--ink)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:880px}
th{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
th button{all:unset;cursor:pointer}
th button:focus-visible{outline:3px solid var(--hi)}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
.docd{display:flex;flex-direction:column;gap:2px}
.docd .d{font-variant-numeric:tabular-nums;font-weight:500}
.docd small{font-size:12px}
.t-valid{color:var(--ok)}.t-due{color:var(--due)}.t-expired{color:var(--bad)}.t-missing{color:var(--miss)}
.muted{color:var(--ink-3)}
.cards{display:none;flex-direction:column;gap:10px}
.vcard{all:unset;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.vcard:focus-visible{outline:3px solid var(--hi)}
.vcard .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.vcard dl{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0}
.vcard dt{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.vcard dd{margin:2px 0 0}

/* renewals */
.lane{display:flex;flex-direction:column;gap:8px}
.lane-h{display:flex;align-items:baseline;gap:10px}
.lane-h h2{font:600 18px/1 var(--f-display);letter-spacing:.04em;text-transform:uppercase}
.lane-h .num{color:var(--ink-3);font-family:var(--f-mono);font-size:13px}
.ritem{display:grid;grid-template-columns:4px minmax(150px,1.2fr) minmax(160px,1fr) minmax(120px,.8fr) auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px 12px 0;overflow:hidden}
.ritem .bar{align-self:stretch;margin:-12px 0;background:var(--c)}
.ritem .who{color:var(--ink-2);font-size:12.5px}
.ritem .doc b{display:block;font-weight:600}
.ritem .when{font:600 15px/1.2 var(--f-mono);color:var(--c)}
.ritem .when small{display:block;font:400 12px/1.3 var(--f-body);color:var(--ink-3)}
.ritem .btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

/* activity */
.feed{display:flex;flex-direction:column}
.ev{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.ev:first-child{border-top:0}
.ev .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.ev .ic svg{width:15px;height:15px}
.ev h3{font-size:14px;font-weight:600}
.ev h3 button{all:unset;cursor:pointer;font:700 15px/1 var(--f-display);letter-spacing:.05em;text-transform:uppercase}
.ev h3 button:hover{text-decoration:underline}
.ev ul{margin:4px 0 0;padding:0;list-style:none;font-size:13px;color:var(--ink-2)}
.ev ul li{overflow-wrap:anywhere}
.ev del{color:var(--ink-3)}
.ev ins{text-decoration:none;color:var(--ink)}
.ev .meta{font-size:12px;color:var(--ink-3);margin-top:4px}

/* empty */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:48px 16px;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
.empty h3{font:700 24px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.03em}
.empty p{margin:0;color:var(--ink-2);max-width:52ch}
.empty .actions{justify-content:center}
.skel{height:14px;border-radius:6px;background:linear-gradient(90deg,var(--surface-2),var(--line),var(--surface-2));background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}

/* dialogs */
dialog{border:0;padding:0;border-radius:14px;background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35);width:min(720px,calc(100vw - 24px));max-height:calc(100vh - 32px)}
dialog::backdrop{background:rgba(10,20,20,.5)}
dialog.drawer{margin:0 0 0 auto;height:100vh;max-height:100vh;border-radius:14px 0 0 14px;width:min(560px,100vw)}
.dlg{display:flex;flex-direction:column;max-height:inherit;height:100%}
.dlg-h{padding:18px 20px 12px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start;border-bottom:1px solid var(--line)}
.dlg-h h2{font:700 24px/1.05 var(--f-display);text-transform:uppercase;letter-spacing:.03em}
.dlg-h p{margin:4px 0 0;color:var(--ink-2);font-size:13px}
.dlg-b{padding:18px 20px;overflow:auto;display:flex;flex-direction:column;gap:16px}
.dlg-f{padding:12px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;align-items:center}
.dlg-f .grow{flex:1;min-width:0;font-size:12.5px;color:var(--ink-3)}
.x{all:unset;cursor:pointer;width:32px;height:32px;display:grid;place-items:center;border-radius:8px;color:var(--ink-2);flex:none}
.x:hover{background:var(--surface-2)}
.x:focus-visible{outline:3px solid var(--hi)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.form .full{grid-column:1/-1}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld label{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--accent);outline:2px solid var(--accent-soft)}
.fld small{color:var(--ink-3);font-size:12px}
.fld .err{color:var(--bad);font-size:12px}
.sect{grid-column:1/-1;display:flex;align-items:center;gap:8px;font:600 15px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);padding-top:6px;border-top:1px solid var(--line);margin-top:4px;padding-block:12px 0}
.formerr{background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:10px 12px;font-size:13.5px}

/* detail */
.dtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.discs{display:grid;grid-template-columns:1fr 1fr;gap:12px}

<script>
(() => {
"use strict";

/* ═════════ SETTINGS ═════════
   Paste the Web app URL from Apps Script (Deploy ▸ Manage deployments). It ends in /exec. */
const API_URL = "https://script.google.com/macros/s/AKfycbyg0lP03eFrNq41Iif_pPcJ8zrTTOQXZH28z_RpZEspEMD6IkL-ue1tfJu8sEO1GTxL/exec";
/* ════════════════════════════ */
const API_READY = /^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(API_URL);
const REFRESH_MS = 90000;
const PPTX_URL = "https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js";
const PPTX_SRI = "sha384-Cck14aA9cifjYolcnjebXRfWGkz5ltHMBiG4px/j8GS+xQcb7OhNQWZYyWjQ+UwQ";

/* ───────── constants ───────── */
// Asset groups follow the Mining asset register (its group sheets); the last four hold Project fleet that isn't in it.
const ASSET_GROUPS = ["Excavators","Dozers","Compactors","Graders","Dump trucks","ADT trucks","Support trucks","Wheel loaders","Drill rigs",
  "Dewatering pumps","Gensets","Lighting towers","Mobile crushers","Light vehicles","Tipper trucks","Buses","Haulage & low beds","Other equipment"];
const IN_REGISTER_GROUPS = new Set(ASSET_GROUPS.slice(0,14));
const CATS = ASSET_GROUPS.map(g=>({id:g,name:g}));
// Fleet types: code = fleet-number prefix; the third value is the asset group a new asset of that type goes in. Keep in step with Code.gs.
const TYPES = [
  ["EX","Excavator","Excavators"],["DZ","Dozer","Dozers"],["WD","Wheel dozer","Dozers"],["RC","Roller / compactor","Compactors"],["GR","Grader","Graders"],
  ["DT","Rigid dump truck","Dump trucks"],["AT","Articulated dump truck","ADT trucks"],
  ["FT","Fuel tanker","Support trucks"],["ST","Service truck","Support trucks"],["WT","Water tanker","Support trucks"],["FL","Forklift","Support trucks"],
  ["WL","Wheel loader","Wheel loaders"],["DR","Drill rig","Drill rigs"],["DP","Pump","Dewatering pumps"],["GS","Generator, compressor & welder","Gensets"],
  ["LT","Lighting tower","Lighting towers"],["MC","Crusher & screen","Mobile crushers"],["LV","Light vehicle","Light vehicles"],["FV","Van","Light vehicles"],
  ["TT","Tipper truck","Tipper trucks"],["BS","Bus","Buses"],
  ["HT","Haulage tractor","Haulage & low beds"],["LB","Low bed","Haulage & low beds"],["FB","Flatbed truck","Haulage & low beds"],["CT","Cargo truck","Haulage & low beds"],
  ["CN","Crane","Other equipment"],["BH","Backhoe loader","Other equipment"],["TH","Telehandler","Other equipment"],["OT","Other","Other equipment"],
].map(([code,name,cat])=>({code,name,cat}));
const TYPE = Object.fromEntries(TYPES.map(t=>[t.code,t]));
const UNITS = ["Rabotec Mining","Rabotec Project"];
const OPS = ["Active","Parked","Down","Out of site","Retired","Not confirmed"];
const RED = 14;                  // red flag: expires within 2 weeks
const WINDOW = 30;               // renewal window in days
const FIELDS = {
  reg:"Registration", fleetNo:"Fleet no.", group:"Fleet type", assetGroup:"Asset group", unit:"Business unit", site:"Site", op:"Operating status",
  model:"Make / model", responsible:"Responsible person", serialNo:"Chassis / serial no.", engineModel:"Engine model", engineNo:"Engine no.",
  inRegister:"In asset register", rwNo:"Roadworthy cert. no.", rwIssue:"Roadworthy issued", rwExp:"Roadworthy expiry",
  insurer:"Insurer", policyNo:"Policy no.", insIssue:"Insurance issued", insExp:"Insurance expiry", notes:"Notes", archived:"Register status",
  sourceStatus:"Status in source", status:"Status in source", registerStatus:"Status in asset register",
};
const DATE_FIELDS = new Set(["rwIssue","rwExp","insIssue","insExp"]);
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

/* ───────── icons ───────── */
const svg = (p,w=2) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const I = {
  grid:svg('<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>'),
  truck:svg('<path d="M3 17V6a1 1 0 0 1 1-1h10v12"/><path d="M14 9h4l3 4v4h-2"/><circle cx="7" cy="17.5" r="2"/><circle cx="17" cy="17.5" r="2"/><path d="M9 17.5h6"/>'),
  bell:svg('<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/>'),
  chart:svg('<path d="M4 20V4"/><path d="M4 20h16"/><rect x="7" y="12" width="3" height="5"/><rect x="12" y="8" width="3" height="9"/><rect x="17" y="5" width="3" height="12"/>'),
  hist:svg('<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/>'),
  users:svg('<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M21.5 20a6.5 6.5 0 0 0-4-6"/>'),
  plus:svg('<path d="M12 5v14M5 12h14"/>',2.2),
  search:svg('<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>'),
  down:svg('<path d="M12 4v11m0 0 4-4m-4 4-4-4M5 20h14"/>'),
  up:svg('<path d="M12 20V9m0 0 4 4m-4-4-4 4M5 4h14"/>'),
  x:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  stop:svg('<path d="M8.6 2h6.8L22 8.6v6.8L15.4 22H8.6L2 15.4V8.6z"/><path d="M12 8v5M12 16.5v.01"/>',2.2),
  flag:svg('<path d="M5 21V4"/><path d="M5 4h11l-2 4 2 4H5"/>',2.2),
  check:svg('<path d="m5 12 5 5L20 7"/>',2.4),
  edit:svg('<path d="M4 20h4L19 9l-4-4L4 16z"/>'),
  ppt:svg('<rect x="3" y="4" width="18" height="14" rx="2"/><path d="M9 21h6M12 18v3"/><path d="M9 14V8h2.5a2 2 0 0 1 0 4H9"/>'),
};

/* ───────── date helpers (Ghana = UTC) ───────── */
const todayISO = () => new Date().toISOString().slice(0,10);
const dayMs = 86400000;
const toDay = iso => Date.parse(iso + "T00:00:00Z");
function daysLeft(iso, ref){ if(!iso) return null; const n = toDay(iso); if(Number.isNaN(n)) return null; return Math.round((n - toDay(ref||state.today))/dayMs); }
function docStatus(iso){ const d = daysLeft(iso); return d===null?"missing":d<0?"expired":d<=RED?"red":d<=WINDOW?"due":"valid"; }
/* Only road-registered assets (a registration or a document date) need a roadworthy certificate and insurance. */
const roadAsset = v => !!(v.reg || v.rwExp || v.insExp);
const inService = v => !v.archived && v.op!=="Retired";
const RANK = {expired:0,missing:1,red:2,due:3,valid:4,na:5};
function vehStatus(v){ if(!roadAsset(v)) return "na"; const a=docStatus(v.rwExp), b=docStatus(v.insExp); return RANK[a]<=RANK[b]?a:b; }
const isFlag = st => st==="expired"||st==="missing"||st==="red";
const STATUS_LABEL = {expired:"Expired",missing:"Missing",red:"Red flag · 14 days",due:"Due in 30 days",valid:"Valid",na:"No road documents"};
const STATUS_SHORT = {expired:"Expired",missing:"Missing",red:"≤ 14 days",due:"15–30 days",valid:"Valid",na:"N/A"};
function fmtDate(iso){ if(!iso) return "Not recorded"; const [y,m,d]=iso.split("-"); return `${d} ${MONTHS[+m-1]} ${y}`; }
function relText(iso){ const d=daysLeft(iso); if(d===null) return "No date recorded"; if(d<0) return `${-d} day${d===-1?"":"s"} overdue`; if(d===0) return "Expires today"; return `${d} day${d===1?"":"s"} left`; }
function addDays(iso,n){ return new Date(toDay(iso)+n*dayMs).toISOString().slice(0,10); }
function validISO(s){ if(!/^\d{4}-\d{2}-\d{2}$/.test(s)) return false; const t=Date.parse(s+"T00:00:00Z"); return !Number.isNaN(t) && new Date(t).toISOString().slice(0,10)===s; }
function parseAnyDate(raw){
  const s=String(raw||"").trim(); if(!s) return "";
  if(validISO(s)) return s;
  let m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/);          // DD/MM/YYYY (Ghana)
  if(m){ let y=+m[3]; if(y<100) y+=2000; const iso=`${y}-${String(m[2]).padStart(2,"0")}-${String(m[1]).padStart(2,"0")}`; return validISO(iso)?iso:null; }
  m = s.match(/^(\d{1,2})[\s\-]([A-Za-z]{3,})[\s\-,]*(\d{4})$/);            // 5 Mar 2027
  if(m){ const mi=MONTHS.findIndex(x=>m[2].toLowerCase().startsWith(x.toLowerCase())); if(mi<0) return null; const iso=`${m[3]}-${String(mi+1).padStart(2,"0")}-${String(m[1]).padStart(2,"0")}`; return validISO(iso)?iso:null; }
  return null;
}

/* ───────── misc helpers ───────── */
const esc = s => String(s??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const normReg = s => String(s||"").toUpperCase().replace(/\s+/g," ").trim();
const normFleet = s => String(s||"").toUpperCase().replace(/\s+/g,"");
const regKey = s => normReg(s).replace(/[\s\-]/g,"");
const $ = (sel, root=document) => root.querySelector(sel);
const typeName = code => (TYPE[code]||{name:code||"—"}).name;
const catOf = code => (TYPE[code]||{cat:"Other equipment"}).cat;
const groupOf = v => ASSET_GROUPS.includes(v.assetGroup) ? v.assetGroup : catOf(v.group);
const assetName = v => v.fleetNo || v.reg || "Unnamed asset";
const plural = (n,w,p) => `${n} ${n===1?w:(p||w+"s")}`;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,4200); }
function csvCell(v){ let s=String(v??""); if(/^\s*[=+@\-]/.test(s)) s="'"+s; return '"'+s.replace(/"/g,'""')+'"'; }
function parseCSV(text){
  text = text.replace(/^﻿/,"");
  const rows=[]; let row=[], f="", q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(f); f=""; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(f); rows.push(row); row=[]; f=""; }
    else f+=c;
  }
  if(f!==""||row.length){ row.push(f); rows.push(row); }
  return rows.filter(r=>r.some(x=>String(x).trim()!==""));
}
function download(name, blob){
  const url=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=url; a.download=name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),2000);
}
const slug = s => String(s||"").replace(/[^A-Za-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,60) || "all";

/* ───────── state ───────── */
const EMPTY_F = {q:"", unit:"", cat:"", group:"", site:"", op:"", status:"", archived:false};
const state = {
  today: todayISO(),
  view: "overview",
  vehicles: [],
  loaded: false,
  dbState: "connecting",    // signin | connecting | live | offline
  activity: [],
  hist: {},                 // full history per asset, loaded when its drawer opens
  session: null,            // {token, email, name, role}
  users: [], usersLoaded: false,
  syncedAt: null,
  demo: false,
  canWrite: false,
  f: {...EMPTY_F},
  r: {unit:"", cat:"", group:"", site:"", op:"", status:"", retired:false},
  sort: {key:"status", dir:1},
  limit: 150,
};

/* ───────── backend (Google Apps Script) ───────── */
function newRid(){ const a=new Uint8Array(16); (crypto.getRandomValues?crypto.getRandomValues(a):a.forEach((_,i)=>a[i]=Math.random()*256|0)); return Array.from(a,b=>b.toString(16).padStart(2,"0")).join(""); }
/* Google sometimes runs a request but fails to deliver the reply (an HTML error page instead of JSON).
   Each call carries a request ID; retries reuse it, so the server returns the stored answer rather than repeating the change. */
async function api(action, payload){
  if(!API_READY) throw new Error("The app isn't connected to its Google Sheet yet. Set API_URL in index.html.");
  const s=state.session||{};
  const body=JSON.stringify({action,token:s.token,rid:newRid(),...(payload||{})});
  const waits=[0,1500,3000,6000];
  let lastErr=null;
  for(let i=0;i<waits.length;i++){
    if(waits[i]) await new Promise(r=>setTimeout(r,waits[i]));
    let text="";
    try{
      const ctl=new AbortController(); const timer=setTimeout(()=>ctl.abort(),45000);
      const res=await fetch(API_URL,{method:"POST",credentials:"omit",headers:{"Content-Type":"text/plain;charset=utf-8"},body,redirect:"follow",signal:ctl.signal});
      clearTimeout(timer);
      text=await res.text();
    }catch(e){ lastErr="network"; continue; }
    let out; try{ out=JSON.parse(text); }catch(e){ lastErr="reply"; continue; }
    // Google now and then answers a POST with the GET status reply instead of running it: ask again (same request ID, so nothing runs twice)
    if(out&&out.app){ lastErr="reply"; continue; }
    if(!out.ok){ const err=new Error(out.error||"Something went wrong."); err.code=out.code; if(out.code==="auth"&&state.session) signOut(true); throw err; }
    return out;
  }
  const err=new Error(lastErr==="network"
    ? "Can't reach the register. Check the network connection and try again."
    : "Google didn't send back a reply after several tries. Refresh the page: your last change may already be saved.");
  err.code="network"; throw err;
}
async function refresh(quiet){
  if(state.demo||!state.session) return;
  try{
    const r=await api("list");
    state.vehicles=r.vehicles||[]; state.activity=(r.activity||[]).slice().sort((a,b)=>a.at<b.at?1:a.at>b.at?-1:0); applyUser(r.user); state.loaded=true; state.dbState="live"; state.syncedAt=new Date();
    render();
  }catch(e){
    if(e.code==="auth") return;
    state.loaded=true;
    if(!quiet||!state.vehicles.length){ state.dbState="offline"; render(); }
    if(!quiet) toast(e.message);
  }
}

  set(v,remember){ for(const st of [()=>localStorage,()=>sessionStorage]){ try{ st().removeItem(SKEY); }catch(e){} }
    if(v){ try{ (remember?localStorage:sessionStorage).setItem(SKEY,JSON.stringify(v)); }catch(e){} } },

function docItems(list){
  return list.filter(v=>inService(v)&&roadAsset(v)).flatMap(v=>[["rw","Roadworthy certificate",v.rwExp],["ins","Insurance",v.insExp]].map(([k,label,date])=>({v,k,label,date,left:daysLeft(date),st:docStatus(date)})))
    .sort((a,b)=>(RANK[a.st]-RANK[b.st])||((a.left??-1e6)-(b.left??-1e6)));
}
const renewalItems = list => docItems(list).filter(x=>x.st!=="valid");
function counts(list){
  const c={total:list.length,road:0,valid:0,due:0,red:0,expired:0,missing:0,na:0};
  list.forEach(v=>{ const s=vehStatus(v); c[s]++; if(s!=="na") c.road++; });
  c.flags=c.red+c.expired+c.missing; return c;
}
function matches(v,f){
  return (!f.unit||v.unit===f.unit) && (!f.cat||groupOf(v)===f.cat) && (!f.group||v.group===f.group) && (!f.site||v.site===f.site)
    && (!f.op||v.op===f.op) && (!f.status||(f.status==="flag"?isFlag(vehStatus(v)):vehStatus(v)===f.status));
}
function sitesOf(list){ return [...new Set(list.map(v=>v.site).filter(Boolean))].sort(); }
function filtered(){
  const f=state.f; const qq=f.q.trim().toLowerCase();
  let list=data().filter(v=>!!v.archived===f.archived && matches(v,f)
    && (!qq || [v.reg,v.fleetNo,v.model,v.site,v.unit,typeName(v.group),v.responsible,v.rwNo,v.policyNo,v.insurer,v.serialNo,v.engineNo].join(" ").toLowerCase().includes(qq)));
  const {key,dir}=state.sort;
  const soon=v=>Math.min(daysLeft(v.rwExp)??-1e6,daysLeft(v.insExp)??-1e6);
  const val=v=> key==="status"? RANK[vehStatus(v)]*1e7+(roadAsset(v)?soon(v)+5e6:0)
    : key==="rwExp"||key==="insExp" ? (v[key]||"0000") : key==="asset" ? assetName(v).toLowerCase() : String(v[key]||"").toLowerCase();
  list.sort((a,b)=>{const A=val(a),B=val(b); return (A<B?-1:A>B?1:0)*dir || assetName(a).localeCompare(assetName(b),undefined,{numeric:true});});
  return list;
}

function horizonChart(list){
  const buckets=[{label:"Overdue",rw:0,ins:0}];
  for(let w=0;w<12;w++){ const s=addDays(state.today,w*7); const [,m,d]=s.split("-"); buckets.push({label:`${+d} ${MONTHS[+m-1]}`,rw:0,ins:0}); }
  list.filter(roadAsset).forEach(v=>[["rw",v.rwExp],["ins",v.insExp]].forEach(([k,dt])=>{const l=daysLeft(dt); if(l===null) return; if(l<0) buckets[0][k]++; else if(l<84) buckets[1+Math.floor(l/7)][k]++;}));
  const weekMax=Math.max(1,...buckets.slice(1).map(b=>b.rw+b.ins)), od=buckets[0].rw+buckets[0].ins;
  const max=od>weekMax*2.5?weekMax*1.6:Math.max(weekMax,od); const nice=max<=4?4:Math.ceil(max/4)*4; const clip=od>nice;
  const W=640,H=230,L=34,R=8,T=12,B=40, cw=(W-L-R)/buckets.length, bw=Math.min(28,cw*.62), y=v=>T+(H-T-B)*(1-v/nice);
  let g="";
  for(let i=0;i<=4;i++){const v=nice/4*i; g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--ink-3)" font-family="IBM Plex Mono,monospace">${v}</text>`;}
  // the first two weeks are the red-flag window
  g+=`<rect x="${L+cw*1+1}" y="${T}" width="${cw*2-2}" height="${H-T-B}" fill="var(--bad-soft)" opacity=".55" rx="4"/><text x="${L+cw*2}" y="${T+12}" text-anchor="middle" font-size="10" font-weight="600" fill="var(--bad)">2 WEEKS</text>`;
  buckets.forEach((b,i)=>{
    const x=L+cw*i+(cw-bw)/2, tot=b.rw+b.ins;
    if(i===0&&tot) g+=`<rect x="${L+cw*i+2}" y="${T}" width="${cw-4}" height="${H-T-B}" fill="var(--bad-soft)" rx="4"/>`;
    if(i===0&&clip){ // too tall to share a scale with the weekly bars: draw it cut off, with the numbers
      const rh=(H-T-B)*b.rw/tot;
      g+=`<rect x="${x}" y="${T+14}" width="${bw}" height="${H-T-B-14}" fill="var(--hi)" rx="2"/><rect x="${x}" y="${y(0)-rh}" width="${bw}" height="${rh}" fill="var(--accent)" rx="2"/><path d="M${x-3} ${T+30}l${bw+6}-6M${x-3} ${T+36}l${bw+6}-6" stroke="var(--surface)" stroke-width="3"/><title>Overdue: ${b.rw} roadworthy, ${b.ins} insurance</title>`;
      g+=`<text x="${x+bw/2}" y="${T+9}" text-anchor="middle" font-size="11" font-weight="600" fill="var(--bad)" font-family="IBM Plex Mono,monospace">${tot}</text><text x="${L+cw/2}" y="${H-B+18}" text-anchor="middle" font-size="11" fill="var(--bad)" font-weight="600">Overdue</text>`;
      return;
    }
    if(b.rw) g+=`<rect x="${x}" y="${y(b.rw)}" width="${bw}" height="${y(0)-y(b.rw)}" fill="var(--accent)" rx="2"><title>${b.label}: ${b.rw} roadworthy</title></rect>`;
    if(b.ins) g+=`<rect x="${x}" y="${y(tot)}" width="${bw}" height="${y(b.rw)-y(tot)}" fill="var(--hi)" rx="2"><title>${b.label}: ${b.ins} insurance</title></rect>`;
    if(tot) g+=`<text x="${x+bw/2}" y="${y(tot)-5}" text-anchor="middle" font-size="11" font-weight="600" fill="${i<=2?"var(--bad)":"var(--ink)"}" font-family="IBM Plex Mono,monospace">${tot}</text>`;
    if(i===0||(i>1&&i%2===0)) g+=`<text x="${L+cw*i+cw/2}" y="${H-B+18}" text-anchor="middle" font-size="11" fill="${i===0?"var(--bad)":"var(--ink-3)"}" font-weight="${i===0?600:400}">${i===0?"Overdue":b.label}</text>`;
  });
  g+=`<text x="${L+cw*2}" y="${H-4}" font-size="10.5" fill="var(--ink-3)">Week starting →</text>`;
  const total=buckets.reduce((s,b)=>s+b.rw+b.ins,0);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Documents expiring per week over the next 12 weeks; ${total} in total including ${buckets[0].rw+buckets[0].ins} overdue">${g}</svg>`;
}

/* ───────── all assets ───────── */
function filterSelects(f, prefix){
  const all=data();
  const types=TYPES.filter(t=>all.some(v=>v.group===t.code&&(!f.cat||groupOf(v)===f.cat)));
  const sel=(id,label,items,val)=>`<select class="f" id="${prefix}-${id}" aria-label="${label}"><option value="">${label}</option>${items.map(([v,l])=>`<option value="${esc(v)}" ${val===v?"selected":""}>${esc(l)}</option>`).join("")}</select>`;
  return sel("unit","All business units",UNITS.map(u=>[u,u]),f.unit)
    + sel("cat","All asset groups",CATS.filter(c=>all.some(v=>groupOf(v)===c.id)).map(c=>[c.id,c.name]),f.cat)
    + sel("group","All fleet types",types.map(t=>[t.code,`${t.code} · ${t.name}`]),f.group)
    + sel("site","All sites",sitesOf(all).map(s=>[s,s]),f.site)
    + sel("op","Any operating status",OPS.map(s=>[s,s]),f.op)
    + sel("status","Any document status",[["flag","Red flags (all)"],...Object.entries(STATUS_LABEL)],f.status);
}

/* ───────── alerts & renewals ───────── */
function viewAlerts(){
  const items=renewalItems(data());
  let h=header("Fleet compliance","Alerts & renewals",`Red flags first: anything expired, not recorded, or expiring within ${RED} days. Then documents due in ${RED+1} to ${WINDOW} days. An asset can appear twice.`,writeActions(`<button class="btn" data-act="report-flags">${I.ppt}Red-flag report</button>`))+banners();
  if(!state.loaded&&!state.demo) return h+loadingBlock();
  if(!service().length) return h+emptyFleet();
  if(!items.length) return h+`<div class="empty">${I.check.replace("<svg",'<svg width="40" height="40" style="color:var(--ok)"')}<h3>Nothing to renew</h3><p>Every road document on the register is valid for more than ${WINDOW} days.</p></div>`+footer();
  const lanes=[
    ["Expires within 2 weeks",x=>x.st==="red","var(--bad)",true],
    ["Expired",x=>x.st==="expired","var(--bad-deep)",true],
    ["Not recorded",x=>x.st==="missing","var(--miss)",true],
    [`Due in ${RED+1} to ${WINDOW} days`,x=>x.st==="due","var(--due)",false],
  ];
  const ce=canEdit();
  lanes.forEach(([title,fn,col,flag])=>{
    const li=items.filter(fn); if(!li.length) return;
    li.sort((a,b)=>(a.left??-1e6)-(b.left??-1e6));
    h+=`<section class="lane"><div class="lane-h">${flag?`<span class="t-red">${I.flag.replace("<svg",'<svg width="18" height="18"')}</span>`:""}<h2>${title}</h2><span class="num">${li.length}</span></div>${li.map(x=>`<div class="ritem ${flag?"flagged":""}" style="--c:${col}"><span class="bar"></span>
      <div><button class="link" style="color:var(--ink)" data-open="${esc(x.v.id)}"><span class="plate">${esc(assetName(x.v))}</span></button> <span class="fleetno">${esc(x.v.fleetNo?x.v.reg:"")}</span><div class="who">${esc(typeName(x.v.group))} · ${esc(x.v.unit)} · ${esc(x.v.site)}${x.v.responsible?` · ${esc(x.v.responsible)}`:""}</div></div>
      <div class="doc"><b>${x.label}</b><span class="muted">${x.k==="rw"?(x.v.rwNo?"Cert. "+esc(x.v.rwNo):"No certificate number"):(x.v.insurer?esc(x.v.insurer):"No insurer recorded")}</span></div>
      <div class="when">${x.st==="missing"?"No date":fmtDate(x.date)}<small>${relText(x.date)}</small></div>
      <div class="btns">${ce?`<button class="btn sm primary" data-renew="${esc(x.v.id)}" data-kind="${x.k}">Record renewal</button>`:`<button class="btn sm" data-open="${esc(x.v.id)}">View</button>`}</div></div>`).join("")}</section>`;
  });
  return h+footer();
}

    </tbody></table></div></section>`;
  return h+footer();

/* ───────── activity ───────── */
function viewActivity(){
  let h=header("Fleet compliance","Activity log","Every change saved to the register, newest first, with who made it and what changed. Imported history from the old trackers is kept in each asset's history.","")+banners();
  if(!state.loaded&&!state.demo) return h+loadingBlock();
  const evs=activityList().slice(0,300);
  if(!evs.length) return h+`<div class="empty"><h3>No changes yet</h3><p>Adding assets, recording renewals and archiving are all logged here automatically.</p></div>`;
  h+=`<section class="panel"><div class="panel-h"><div><h2>Recent changes</h2><p>Latest ${evs.length} events · times in Ghana (GMT)</p></div></div><div class="feed">${evs.map(evHTML).join("")}</div></section>`;
  return h+footer();
}
function evHTML(e){
  const when=new Date(e.at); const ts=Number.isNaN(when.getTime())?"":when.toLocaleString("en-GB",{timeZone:"UTC",day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});
  const imported=/^Imported/.test(e.action);
  const ch=(e.changes||[]).slice(0,10).map(c=>imported||c.from===""&&/added|Added/.test(e.action)?`<li>${esc(FIELDS[c.f]||c.f)}: <ins>${esc(fmtVal(c.f,c.to))}</ins></li>`:`<li>${esc(FIELDS[c.f]||c.f)}: <del>${esc(fmtVal(c.f,c.from))}</del> → <ins>${esc(fmtVal(c.f,c.to))}</ins></li>`).join("");
  return `<article class="ev"><span class="ic">${/renew/i.test(e.action)?I.check:/added|Added|Imported/.test(e.action)?I.plus:I.edit}</span><div>
    <h3>${esc(e.action)} · ${findV(e.vehicleId)?`<button data-open="${esc(e.vehicleId)}">${esc(e.reg)}</button>`:`<span class="plate">${esc(e.reg)}</span>`}</h3>${ch?`<ul>${ch}</ul>`:""}
    <div class="meta">${esc(e.by||"Someone")} · ${imported?when.toLocaleDateString("en-GB",{timeZone:"UTC",day:"2-digit",month:"short",year:"numeric"}):ts+" GMT"}</div></div></article>`;
}
function fmtVal(f,v){ if(f==="archived") return v===true||v==="true"?"Archived":"Current"; if(DATE_FIELDS.has(f)) return v?fmtDate(v):"not recorded"; if(f==="group") return v?`${v} · ${typeName(v)}`:"not recorded"; return v===""||v==null?"not recorded":String(v); }

/* ───────── render ───────── */
function render(){
  $("#app").classList.toggle("locked", state.dbState==="signin" && !state.demo);

  renderNav();
  const ae=document.activeElement, keepQ=ae&&ae.id==="q"?[ae.selectionStart,ae.selectionEnd]:null;
  const c=$("#canvas");
  if(state.view==="team"&&!isAdmin()) state.view="overview";
  const V={overview:viewOverview,assets:viewAssets,alerts:viewAlerts,reports:viewReports,activity:viewActivity,team:viewTeam};
  c.innerHTML=(V[state.view]||viewOverview)();

let histRecords=null;
function handleHistFile(file){
  const msg=$("#hist-msg"); histRecords=null; if(!file) return;
  const rd=new FileReader();
  rd.onload=()=>{
    let d; try{ d=JSON.parse(String(rd.result)); }catch(e){ msg.textContent="That file isn't a history file (it couldn't be read as JSON)."; return; }
    if(!d||d.kind!=="rabotec-history-import"||!Array.isArray(d.records)||!d.records.length){ msg.textContent="That file isn't a Rabotec history file."; return; }
    histRecords=d.records;
    msg.innerHTML=`<b>${plural(d.records.length,"asset")}</b> ready${d.source?` from ${esc(d.source)}`:""}. <button class="btn sm primary" id="hist-go">${I.up}Import now</button>`;
  };
  rd.readAsText(file);
}
async function runHistoryImport(btn){
  const recs=histRecords; if(!recs) return; btn.disabled=true; btn.textContent="Importing…";
  const prog=$("#hist-prog"), bar=prog.querySelector("span"), msg=$("#hist-msg"); prog.hidden=false;
  const per=150, out=[];
  try{
    for(let i=0;i<recs.length;i+=per){
      const r=await api("importHistory",{records:recs.slice(i,i+per)}); out.push(r.message);
      bar.style.width=(Math.min(recs.length,i+per)/recs.length*100)+"%";
    }
    const n=out.reduce((s,m)=>s+(+(/Imported (\d+) assets/.exec(m)||[0,0])[1]),0);
    msg.textContent=state.histMsg=`Done: ${plural(n,"asset")} added.`+(out.some(m=>/Skipped/.test(m))?" Some were skipped: "+out.filter(m=>/Skipped/.test(m)).map(m=>m.replace(/^.*?Skipped/,"Skipped")).join(" ").slice(0,400):"");
    histRecords=null; toast(`History import finished: ${plural(n,"asset")} added`); refresh(true);
  }catch(e){ msg.textContent=e.message+" Choose the file again to finish: assets already added will be skipped."; }
}
async function teamAction(fn, okMsg){

function validate(n, selfId){
  const e={};
  if(!n.reg&&!n.fleetNo) e.fleetNo="Enter a fleet no., a registration, or both.";
  if(n.reg&&state.vehicles.some(x=>x.id!==selfId && x.reg && regKey(x.reg)===regKey(n.reg))) e.reg="This registration is already on the register (check archived assets too).";
  if(n.fleetNo&&state.vehicles.some(x=>x.id!==selfId && x.fleetNo && regKey(x.fleetNo)===regKey(n.fleetNo))) e.fleetNo="This fleet no. is already on the register (check archived assets too).";
  if(!TYPE[n.group]) e.group="Choose a fleet type.";
  ["rwIssue","rwExp","insIssue","insExp"].forEach(k=>{ if(n[k] && !validISO(n[k])) e[k]="Enter a valid date."; });
  if(!e.rwIssue&&!e.rwExp&&n.rwIssue&&n.rwExp&&n.rwIssue>n.rwExp) e.rwIssue="Issue date must be on or before the expiry date.";
  if(!e.insIssue&&!e.insExp&&n.insIssue&&n.insExp&&n.insIssue>n.insExp) e.insIssue="Start date must be on or before the expiry date.";

function payload(v){ const o={id:v.id||""}; Object.keys(BLANK).forEach(k=>o[k]=v[k]??BLANK[k]); o.archived=!!v.archived; return o; }
async function saveVehicle(next, prev, action){
  if(state.demo) throw new Error("The sample fleet can't be changed. Go back to the live register.");
  let r;
  try{ r=await api("save",{vehicle:payload({...next,id:prev?prev.id:""}), rev:prev?prev.rev:0, label:action}); }
  catch(e){ if(e.code==="conflict"||e.code==="gone"||e.code==="duplicate") refresh(true); throw e; }
  if(r.vehicle){ const i=state.vehicles.findIndex(x=>x.id===r.vehicle.id); if(i>=0) state.vehicles[i]=r.vehicle; else state.vehicles.push(r.vehicle); delete state.hist[r.vehicle.id]; }
  render();
  refresh(true);
  return r;
}

function mapType(s, fleetNo){
  const t=String(s||"").trim(); const up=t.toUpperCase();
  if(TYPE[up]) return up; if(PREFIX[up]) return PREFIX[up];
  const byName=TYPES.find(x=>x.name.toLowerCase()===t.toLowerCase()); if(byName) return byName.code;
  const lo=t.toLowerCase();
  const words=[[/light|pick ?up|hilux|land ?cruiser/,"LV"],[/\bvan\b|hiace|sprinter|starex/,"FV"],[/\bbus/,"BS"],[/tipper/,"TT"],[/water/,"WT"],[/fuel|bowser/,"FT"],[/service/,"ST"],[/low ?bed/,"LB"],[/flat ?bed/,"FB"],[/articulat|\badt\b/,"AT"],[/dump|haul/,"DT"],[/excavat/,"EX"],[/dozer/,"DZ"],[/grader/,"GR"],[/loader/,"WL"],[/drill/,"DR"],[/pump/,"DP"],[/generat|compressor|welder/,"GS"],[/light(ing)? tower/,"LT"],[/crush|screen/,"MC"],[/crane/,"CN"],[/roller|compact/,"RC"]];

function mapUnit(s){ const t=String(s||"").toLowerCase(); return t.includes("project")?"Rabotec Project":t.includes("mining")?"Rabotec Mining":""; }
function mapOp(s){ const t=String(s||"").toLowerCase(); if(!t) return ""; if(/retir|sold|scrap|convert/.test(t)) return "Retired"; if(/down|break|repair|workshop|maint|ground/.test(t)) return "Down"; if(/park|idle|standby/.test(t)) return "Parked"; if(/out of site|off site|offsite|transfer/.test(t)) return "Out of site"; if(/\?|confirm|unknown/.test(t)) return "Not confirmed"; return "Active"; }
const HEAD_ALIASES={
  fleetNo:["fleet no.","fleet no","asset id","asset","fleet number","asset no","fleet id","equip id","equipment id","fleet"],

function analyseImport(text){
  const rows=parseCSV(text); if(rows.length<2) return {error:"The file has no data rows. Use the template, or a spreadsheet saved as CSV."};
  const head=rows[0].map(h=>h.trim().toLowerCase());
  const col={}; Object.entries(HEAD_ALIASES).forEach(([k,al])=>{ const i=head.findIndex(h=>al.includes(h)); if(i>=0) col[k]=i; });
  if(col.reg===undefined&&col.fleetNo===undefined) return {error:"No fleet no. or registration column found. The first row must be column headings, such as \"Fleet no.\" and \"Registration\"."};
  const byFleet=new Map(state.vehicles.filter(v=>v.fleetNo).map(v=>[regKey(v.fleetNo),v])), byReg=new Map(state.vehicles.filter(v=>v.reg).map(v=>[regKey(v.reg),v]));
  const seen=new Set(); const out=[];
  rows.slice(1).forEach((r,i)=>{
    const get=k=>col[k]===undefined?"":String(r[col[k]]??"").trim();
    const rec={fleetNo:normFleet(get("fleetNo")),reg:normReg(get("reg")),unit:mapUnit(get("unit")),site:get("site"),op:mapOp(get("op")),model:get("model"),serialNo:get("serialNo"),
      engineModel:get("engineModel"),engineNo:get("engineNo"),responsible:get("responsible"),inRegister:/^y/i.test(get("inRegister"))?"Yes":/^n/i.test(get("inRegister"))?"No":"",
      rwNo:get("rwNo"),insurer:get("insurer"),policyNo:get("policyNo"),notes:get("notes").slice(0,2000)};
    rec.group=mapType(get("group"),rec.fleetNo);
    { const g=get("assetGroup").toLowerCase(); rec.assetGroup=ASSET_GROUPS.find(x=>x.toLowerCase()===g||x.toLowerCase().replace(/s$/,"")===g.replace(/s$/,""))||""; }
    const problems=[];
    if(!rec.reg&&!rec.fleetNo) problems.push("no fleet no. or registration");
    ["rwIssue","rwExp","insIssue","insExp"].forEach(k=>{ const p=parseAnyDate(get(k)); if(p===null) problems.push(`${FIELDS[k].toLowerCase()} "${get(k)}" not a date`); rec[k]=p||""; });
    const key=(rec.fleetNo?"f"+regKey(rec.fleetNo):"")+"|"+(rec.reg?"r"+regKey(rec.reg):"");
    if(seen.has(key)) problems.push("duplicate in file");
    seen.add(key);
    const match=(rec.fleetNo&&byFleet.get(regKey(rec.fleetNo)))||(rec.reg&&byReg.get(regKey(rec.reg)))||null;
    if(!match&&!rec.group) problems.push(get("group")?`unknown fleet type "${get("group")}"`:"no fleet type");
    out.push({line:i+2, rec, match, problems, kind: problems.length?"skip":match?"update":"new"});
  });
  return {rows:out};
}

  paint(`<label class="drop" id="drop" for="imp-file"><b>Choose a CSV file</b><span class="muted">or drop it here. Dates can be 2027-01-14, 14/01/2027 or 14 Jan 2027.</span><input id="imp-file" type="file" accept=".csv,text/csv" hidden></label>

      </tbody></table></div><div id="imp-prog" hidden><div class="progress"><span style="width:0%"></span></div><p class="muted" id="imp-msg" style="margin:6px 0 0"></p></div>`,
      `<span class="grow">${s.length?"Fix skipped rows in the file and import again to add them.":""}</span><button class="btn" data-close>Cancel</button><button class="btn primary" id="imp-go" ${n.length+u.length?"":"disabled"}>Import ${plural(n.length+u.length,"asset")}</button>`);

  };
  doc(6.95,1.55,"Roadworthy certificate",v.rwExp,[v.rwNo?"Certificate "+v.rwNo:"No certificate number",v.rwIssue?"Issued "+pDate(v.rwIssue):""].filter(Boolean));
  doc(6.95,3.85,"Insurance",v.insExp,[v.insurer||"No insurer recorded",v.policyNo?"Policy "+v.policyNo:"",v.insIssue?"From "+pDate(v.insIssue):""].filter(Boolean));
  if(v.notes) s.addText("Notes: "+v.notes,{x:0.55,y:6.35,w:12.3,h:0.55,fontFace:FONT,fontSize:9.5,color:C.ink2,valign:"top",fit:"shrink"});
  if(hist.length){
    const body=hist.slice(0,60).map(e=>{ const d=new Date(e.at); const when=Number.isNaN(d.getTime())?"":d.toLocaleDateString("en-GB",{timeZone:"UTC",day:"2-digit",month:"short",year:"numeric"});
      const ch=(e.changes||[]).slice(0,6).map(c=>`${FIELDS[c.f]||c.f}: ${c.from!==""&&c.from!=null&&!/^Imported/.test(e.action)?fmtVal(c.f,c.from)+" → ":""}${fmtVal(c.f,c.to)}`).join("; ");
      return [cell(when),cell(e.action,{bold:true}),cell(ch||"—",{fontSize:8.5}),cell(e.by||"")]; });
    pagedTable(p,"History",`${assetName(v)} · newest first`,[hdr("Date"),hdr("What happened"),hdr("Details"),hdr("By")],body,[1.3,3.1,6.2,1.75],11);
  }
  await p.writeFile({fileName:`Rabotec-Asset-Report-${slug(assetName(v))}-${state.today}.pptx`});
}
async function runReport(btn, fn){
  const label=btn?btn.innerHTML:""; if(btn){ btn.disabled=true; btn.textContent="Making report…"; }
  try{ await fn(); toast("Report downloaded. Open it in PowerPoint or Google Slides."); }
  catch(e){ console.error(e); toast(e.message||"The report couldn't be made."); }
  finally{ if(btn&&btn.isConnected){ btn.disabled=false; btn.innerHTML=label; } }
}

/* ───────── events ───────── */
document.addEventListener("click",e=>{
  const t=e.target.closest("button,[data-open],a"); if(!t) return;
  if(t.hasAttribute("data-close")){ t.closest("dialog").close(); return; }
  if(t.id==="hist-go"){ runHistoryImport(t); return; }
  if(t.dataset.go){ const f={}; ["cat","group","status","unit"].forEach(k=>{ if(t.dataset[k]) f[k]=t.dataset[k]; }); closeAll(); go(t.dataset.go,f); return; }
  if(t.dataset.open){ openDetail(t.dataset.open); return; }
  if(t.dataset.edit){ openEdit(t.dataset.edit); return; }
  if(t.dataset.renew){ openRenew(t.dataset.renew,t.dataset.kind); return; }
  if(t.dataset.archive){ toggleArchive(t.dataset.archive); return; }
  if(t.dataset.reportAsset){ const v=findV(t.dataset.reportAsset); if(v) runReport(t,()=>makeAssetReport(v)); return; }
  if(t.dataset.reportType){ const f={...state.r,group:t.dataset.reportType}; const list=reportList().filter(v=>v.group===f.group); runReport(t,()=>makeReport(list,reportTitle(f),reportTitle(f))); return; }
  if(t.dataset.reportSite){ const f={...state.r,site:t.dataset.reportSite,unit:t.dataset.unit}; const list=reportList().filter(v=>v.site===f.site&&v.unit===f.unit); runReport(t,()=>makeReport(list,reportTitle(f))); return; }
  if(t.dataset.reportCat){ const f={...state.r,cat:t.dataset.reportCat,group:""}; const list=reportList().filter(v=>groupOf(v)===f.cat); runReport(t,()=>makeReport(list,reportTitle(f))); return; }
  if(t.dataset.viewCat){ go("assets",{unit:state.r.unit,site:state.r.site,op:state.r.op,status:state.r.status,cat:t.dataset.viewCat}); return; }
  if(t.dataset.viewType){ go("assets",{unit:state.r.unit,site:state.r.site,op:state.r.op,status:state.r.status,group:t.dataset.viewType}); return; }
  if(t.dataset.sort){ const k=t.dataset.sort; state.sort = state.sort.key===k?{key:k,dir:-state.sort.dir}:{key:k,dir:1}; $("#reg-results").innerHTML=registerResults(); return; }
  if(t.dataset.arch!==undefined){ state.f.archived=t.dataset.arch==="1"; render(); return; }
  if(t.dataset.si){ signinMode=t.dataset.si; const em=$("#si-email"); if(em) signinEmail=em.value.trim().toLowerCase(); renderSignin(true); return; }
  if(t.dataset.statusFor){ const em=t.dataset.statusFor, to=t.dataset.to; t.disabled=true; teamAction(()=>api("userStatus",{email:em,status:to}), ()=>to==="disabled"?`${em} switched off and signed out.`:`${em} switched back on.`); return; }
  if(t.dataset.remove){ const em=t.dataset.remove;
    if(t.dataset.confirm!=="1"){ t.dataset.confirm="1"; t.textContent="Confirm remove"; setTimeout(()=>{ if(t.isConnected){ t.dataset.confirm=""; t.textContent="Remove"; } },4000); return; }
    t.disabled=true; teamAction(()=>api("userRemove",{email:em}), ()=>`${em} removed.`); return; }
  const a=t.dataset.act;
  if(a==="add") openEdit(null);
  else if(a==="import") openImport();
  else if(a==="export") exportCSV(filtered(), `rabotec-assets-${state.demo?"sample-":""}${state.today}.csv`);
  else if(a==="template") exportCSV([], "rabotec-asset-import-template.csv", true);
  else if(a==="report-assets"){ const list=filtered(); if(!list.length){ toast("No assets match, so there's nothing to report."); return; } const f=state.f; const scope=[f.group?typeName(f.group):f.cat?f.cat:"All asset groups",f.unit,f.site,f.op,f.status?(f.status==="flag"?"Red flags":STATUS_LABEL[f.status]):"",f.q?`"${f.q}"`:"",f.archived?"Archived":""].filter(Boolean).join(" · "); runReport(t,()=>makeReport(list,scope)); }
  else if(a==="report-flags"){ const list=service().filter(v=>isFlag(vehStatus(v))); if(!list.length){ toast("No red flags right now."); return; } runReport(t,()=>makeReport(list,"Red flags · all fleet types","red-flags")); }
  else if(a==="r-ppt"){ const list=reportList(); runReport(t,()=>makeReport(list,reportTitle(state.r))); }
  else if(a==="r-csv"){ exportCSV(reportList(), `rabotec-report-${slug(reportTitle(state.r))}-${state.today}.csv`); }
  else if(a==="r-clear"){ state.r={unit:"",cat:"",group:"",site:"",op:"",status:"",retired:false}; render(); }
  else if(a==="more"){ state.limit+=300; $("#reg-results").innerHTML=registerResults(); }
  else if(a==="help") openHelp();
  else if(a==="demo-on"){ state.demo=true; render(); }
  else if(a==="demo-off"){ state.demo=false; closeAll(); render(); }
  else if(a==="refresh"){ refresh(false).then(()=>{ if(state.dbState==="live") toast("Register up to date"); }); }
  else if(a==="signout"){ signOut(false); }
  else if(a==="users-refresh"){ state.usersLoaded=false; render(); }
  else if(a==="clear"){ go("assets"); }
});
document.addEventListener("keydown",e=>{ if(e.key==="Enter"){ const tr=e.target.closest&&e.target.closest("tr[data-open]"); if(tr) openDetail(tr.dataset.open); } });
document.addEventListener("input",e=>{ if(e.target.id==="q"){ state.f.q=e.target.value; state.limit=150; $("#reg-results").innerHTML=registerResults(); } });
document.addEventListener("change",e=>{
  const id=e.target.id||"";
  if(e.target.dataset&&e.target.dataset.roleFor){ const em=e.target.dataset.roleFor, role=e.target.value; teamAction(()=>api("userSave",{email:em,role,invite:false}), ()=>`${em} is now ${role==="admin"?"an admin":"a"+(role==="editor"?"n editor":" viewer")}.`); return; }
  if(id==="hist-file"){ handleHistFile(e.target.files[0]); return; }
  if(id==="r-retired"){ state.r.retired=e.target.checked; render(); return; }
  const m=/^(f|r)-(unit|cat|group|site|op|status)$/.exec(id);
  if(m){ const f=m[1]==="f"?state.f:state.r; f[m[2]]=e.target.value; if(m[2]==="cat"&&f.group&&f.cat&&!data().some(v=>v.group===f.group&&groupOf(v)===f.cat)) f.group=""; state.limit=150; render(); }
});
function closeAll(){ document.querySelectorAll("dialog[open]").forEach(d=>d.close()); }
setInterval(()=>{ const t=todayISO(); if(t!==state.today){ state.today=t; render(); } },60000);

/* ───────── boot ───────── */
state.session = API_READY ? store.get() : null;
if(state.session){ state.dbState="connecting"; render(); refresh(false); }
else { state.dbState="signin"; render(); }
setInterval(()=>{ if(document.visibilityState==="visible" && state.session && !state.demo && !document.querySelector("dialog[open]")) refresh(true); }, REFRESH_MS);
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible" && state.session && state.syncedAt && Date.now()-state.syncedAt>REFRESH_MS) refresh(true); });
})();
</script>
